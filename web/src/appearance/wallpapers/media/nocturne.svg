<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dark optical artwork with spectral diffraction and luminous interference">
  <defs>
    <radialGradient id="ambience" cx="33%" cy="47%" r="66%">
      <stop stop-color="#173052"/>
      <stop offset=".38" stop-color="#0d1930"/>
      <stop offset="1" stop-color="#060c17"/>
    </radialGradient>
    <linearGradient id="spectrum" x1=".09" y1=".22" x2=".91" y2=".8">
      <stop stop-color="#49e8e0"/>
      <stop offset=".26" stop-color="#9eece6"/>
      <stop offset=".5" stop-color="#546fff"/>
      <stop offset=".75" stop-color="#e375dc"/>
      <stop offset="1" stop-color="#eb7289"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="1" y2=".7">
      <stop stop-color="#54eee8"/>
      <stop offset=".55" stop-color="#6585ff"/>
      <stop offset="1" stop-color="#cb7ee8"/>
    </linearGradient>
    <pattern id="scan" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 .5H7" stroke="#bcd8f5" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <pattern id="pixels" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="6" r=".65" fill="#a4d8f9" opacity=".35"/>
      <circle cx="20" cy="19" r=".45" fill="#f0b5eb" opacity=".2"/>
    </pattern>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <path fill="#060c17" d="M0 0h1600v1000H0z"/>
  <path fill="url(#ambience)" d="M0 0h1600v1000H0z"/>
  <path fill="url(#pixels)" d="M0 0h1600v1000H0z"/>

  <!-- A spectral aperture: soft physical bloom sits behind crisp interference. -->
  <g fill="none" stroke="url(#spectrum)" filter="url(#bloom)" opacity=".65">
    <ellipse cx="542" cy="482" rx="333" ry="325" stroke-width="48" transform="rotate(-10 542 482)"/>
    <ellipse cx="542" cy="482" rx="260" ry="254" stroke-width="27" transform="rotate(-10 542 482)"/>
  </g>
  <g fill="none" stroke="url(#cold)" filter="url(#soft)" opacity=".62">
    <ellipse cx="542" cy="482" rx="392" ry="379" stroke-width="6" transform="rotate(-10 542 482)"/>
    <ellipse cx="542" cy="482" rx="335" ry="328" stroke-width="13" transform="rotate(-10 542 482)"/>
    <ellipse cx="542" cy="482" rx="270" ry="263" stroke-width="10" transform="rotate(-10 542 482)"/>
    <ellipse cx="542" cy="482" rx="198" ry="194" stroke-width="5" transform="rotate(-10 542 482)"/>
  </g>
  <g fill="none" transform="rotate(-10 542 482)">
    <ellipse cx="542" cy="482" rx="394" ry="380" stroke="url(#spectrum)" stroke-width="1.2" opacity=".54"/>
    <ellipse cx="542" cy="482" rx="374" ry="361" stroke="#b8e8f8" stroke-width=".8" opacity=".36"/>
    <ellipse cx="542" cy="482" rx="350" ry="341" stroke="#57dbdf" stroke-width="1.1" opacity=".7"/>
    <ellipse cx="542" cy="482" rx="338" ry="329" stroke="url(#spectrum)" stroke-width="3.4" opacity=".94"/>
    <ellipse cx="542" cy="482" rx="327" ry="318" stroke="#a9e9f2" stroke-width=".8" opacity=".5"/>
    <ellipse cx="542" cy="482" rx="307" ry="299" stroke="#637efa" stroke-width="1" opacity=".65"/>
    <ellipse cx="542" cy="482" rx="277" ry="270" stroke="url(#spectrum)" stroke-width="4.2" opacity=".82"/>
    <ellipse cx="542" cy="482" rx="263" ry="257" stroke="#aaddfa" stroke-width="1" opacity=".45"/>
    <ellipse cx="542" cy="482" rx="248" ry="243" stroke="#d886ef" stroke-width=".8" opacity=".6"/>
    <ellipse cx="542" cy="482" rx="201" ry="198" stroke="#8dc8ed" stroke-width="1.4" opacity=".42"/>
    <ellipse cx="542" cy="482" rx="192" ry="189" stroke="#e687d8" stroke-width=".7" opacity=".39"/>
  </g>

  <!-- Broken caustics make the aperture read as refracted light, not a bevel. -->
  <g fill="none" stroke-linecap="round">
    <path d="M227 285C288 185 383 129 483 118" stroke="#b5fff1" stroke-width="4" opacity=".88"/>
    <path d="M492 116C548 107 604 112 652 129" stroke="#5de4f0" stroke-width="1.6" opacity=".76"/>
    <path d="M836 414C862 523 812 638 722 719" stroke="#e197f3" stroke-width="3.3" opacity=".85"/>
    <path d="M719 722C668 761 610 779 562 786" stroke="#b3a4ff" stroke-width="1.4" opacity=".6"/>
    <path d="M303 652C246 562 241 463 267 385" stroke="#64e6ed" stroke-width="1.6" opacity=".61"/>
  </g>

  <path fill="#020916" opacity=".78" d="M541 289c114-16 194 76 194 183 0 107-80 199-190 203-114 4-210-75-213-185-4-109 90-184 209-201z"/>
  <path fill="#111d34" opacity=".3" d="M541 314c95-12 167 60 167 157 0 96-72 171-163 178-99 5-185-62-188-159-3-99 76-167 184-176z"/>
  <path fill="url(#scan)" d="M0 0h1600v1000H0z"/>
  <path d="M1135 0v1000" stroke="#a8d4ed" stroke-opacity=".07"/>
  <path d="M1188 0v1000" stroke="#a8d4ed" stroke-opacity=".035"/>
  <path d="M0 874h1600" stroke="#b1d9fb" stroke-opacity=".06"/>
</svg>
