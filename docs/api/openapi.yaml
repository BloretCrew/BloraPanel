      responses:
        '200': {$ref: '#/components/responses/Json'}
        '404': {$ref: '#/components/responses/Error'}
    
  /extensions/catalog/install:
    post:
      tags: [extensions]
      summary: Install or upgrade a package acquired from the catalog
      operationId: installCatalogExtension
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '201': {$ref: '#/components/responses/Json'}
        '409': {$ref: '#/components/responses/Error'}
  /extensions/{id}/manifest:
    get:
      tags: [extensions]
      summary: Read an enabled extension manifest
      operationId: extensionManifest
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '404': {$ref: '#/components/responses/Error'}
  /extensions/{id}/bundle:
    get:
      tags: [extensions]
      summary: Read an enabled bundle for sandbox execution
      operationId: extensionBundle
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: JavaScript bundle, content: {application/javascript: {schema: {type: string}}}}
        '409': {$ref: '#/components/responses/Error'}
  /extensions/{id}/package:
    get:
      tags: [extensions]
      summary: Download an installed package (administrator)
      operationId: extensionPackage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
  /extensions/install:
    post:
      tags: [extensions]
      summary: Install an extension package (administrator)
      operationId: installExtension
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '201': {$ref: '#/components/responses/Json'}
        '409': {$ref: '#/components/responses/Error'}
  /extensions/install-package:
    post:
      tags: [extensions]
      summary: Install a JSON envelope containing a package payload
      operationId: installExtensionPackage
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '201': {$ref: '#/components/responses/Json'}
        '413': {$ref: '#/components/responses/Error'}
  /extensions/{id}/upgrade:
    post:
      tags: [extensions]
      summary: Upgrade an extension with rollback protection
      operationId: upgradeExtension
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '409': {$ref: '#/components/responses/Error'}
  /extensions/{id}/rollback:
    post:
      tags: [extensions]
      summary: Restore the previous verified extension version
      operationId: rollbackExtension
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '409': {$ref: '#/components/responses/Error'}
  /extensions/{id}/enabled:
    post:
      tags: [extensions]
      summary: Enable or disable an extension
      operationId: setExtensionEnabled
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '409': {$ref: '#/components/responses/Error'}
  /extensions/{id}:
    delete:
      tags: [extensions]
      summary: Uninstall an extension, optionally cleaning user data
      operationId: uninstallExtension
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: cleanup, in: query, schema: {type: boolean, default: false}}
      responses:
        '204': {description: Extension uninstalled}
        '409': {$ref: '#/components/responses/Error'}
  /extensions/{id}/notifications:
    post:
      tags: [extensions]
      operationId: authorizeExtensionNotification
      summary: Authorize a notification for the current browser workspace
      description: Requires enabled notification.publish and app.use. Returns inert content with the server-bound appId. The desktop persists and displays it; no message is sent to other users or external services.
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: {type: string, description: Nonblank and at most 256 UTF-8 bytes}
                message: {type: string, description: At most 4096 UTF-8 bytes}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /extensions/{id}/resource:
    patch:
      tags: [extensions]
      operationId: updateExtensionResourceMetadata
      summary: Update instance name, group or tags through resource.write
      description: Requires enabled resource.write, app.use and instance.configure. revision is configRevision from the resource summary. Execution configuration is rejected. Replays use the stable Idempotency-Key.
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resource, revision]
              properties:
                resource: {type: object, required: [kind, id], properties: {kind: {const: instance}, id: {type: string}, nodeId: {type: string}}}
                revision: {type: integer, format: int64}
                name: {type: string}
                group: {type: string}
                tags: {type: array, items: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    get:
      tags: [extensions]
      operationId: readExtensionResource
      summary: Read a resource summary through an enabled extension capability
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {name: kind, in: query, required: true, schema: {type: string, enum: [node, instance]}}
        - {name: id, in: query, required: true, schema: {type: string}}
        - {name: nodeId, in: query, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /extensions/{id}/data:
    get:
      tags: [extensions]
      summary: Read the authenticated user's extension data
      operationId: readExtensionUserData
      description: Requires current app.use and enabled data.read capability. Owners cannot be supplied by clients; administrators also read only their own document. Returns schemaVersion, revision and data.
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    put:
      tags: [extensions]
      summary: Conditionally replace the authenticated user's extension data
      operationId: writeExtensionUserData
      description: Requires current app.use and enabled data.write capability. JSON data is limited to 16 KiB and total managed extension data and receipts to 4 MiB. A repeated request cannot overwrite later data. Package schema and revision must match.
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schemaVersion, expectedRevision, data]
              additionalProperties: false
              properties:
                schemaVersion: {type: integer, minimum: 1}
                expectedRevision: {type: integer, minimum: 0}
                data: {}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /extensions/{id}/tasks:
    post:
      tags: [extensions, tasks]
      summary: Queue a declared extension task using scoped permissions
      operationId: createExtensionTask
      description: Executes the installed package's WASI backend with JSON stdin/stdout. Requires app.use and node.read. The payload is limited to 32 KiB; tasks bind package and module hashes and do not grant host filesystem, environment, network, or process access.
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeId, payload]
              properties:
                nodeId: {type: string}
                payload: {type: object, additionalProperties: true, maxProperties: 256}
      responses:
        '202': {$ref: '#/components/responses/Task'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /extensions/{id}/tasks/{taskId}/status:
    get:
      tags: [extensions, tasks]
      summary: Read a task belonging to this extension
      operationId: readExtensionTask
      description: Requires task ownership (or administrator), current app.use and node.read. Historical tasks remain accessible after disabling or uninstalling the package. Wrong application identity and revoked access return 404.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Task'}
        '404': {$ref: '#/components/responses/Error'}
  /extensions/{id}/tasks/{taskId}/cancel:
    post:
      tags: [extensions, tasks]
      summary: Request cancellation of this extension's task
      operationId: cancelExtensionTask
      description: Uses the same current authorization as task reads. Repeated cancellation returns the existing receipt. Acceptance does not imply terminal cancellation or rollback of completed work.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {name: taskId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Task'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /workspaces:
    get:
      tags: [workspaces]
      summary: List cloud workspace metadata owned by the current user
      operationId: listCloudWorkspaces
      responses:
        '200': {$ref: '#/components/responses/Items'}
  /workspaces/{id}:
    get:
      tags: [workspaces]
      summary: Read one cloud workspace snapshot
      operationId: getCloudWorkspace
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [workspaces]
      summary: Save a cloud workspace with an optimistic revision check
      operationId: putCloudWorkspace
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, deviceId, baseRevision, schemaVersion, includeContent, state]
              properties:
                title: {type: string, maxLength: 160}
                deviceId: {type: string, maxLength: 128}
                baseRevision: {type: integer, format: int64, minimum: 0}
                schemaVersion: {type: integer, minimum: 1}
                includeContent: {type: boolean}
                state: {type: object, additionalProperties: true}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [workspaces]
      summary: Delete one cloud workspace owned by the current user
      operationId: deleteCloudWorkspace
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Cloud snapshot deleted}
        '404': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: blora_session
      description: HttpOnly same-origin session cookie issued by POST /login.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token returned by GET /session; required for non-GET requests.
    idempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
      description: Stable client request identity used for task admission and retry.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    PlanId:
      name: planId
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    Path:
      name: path
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 4096}
    Version:
      name: version
      in: query
      schema: {type: string, minLength: 1, maxLength: 128}
    Offset:
      name: offset
      in: query
      schema: {type: integer, format: int64, minimum: 0, default: 0}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000, default: 50}
    NodeScope:
      name: scope
      in: query
      schema: {type: string, enum: [all, creatable, managed]}
  requestBodies:
    Json:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
  responses:
    Json:
      description: JSON resource or operation result
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    Items:
      description: Bounded collection
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items: {type: array, items: {type: object, additionalProperties: true}}
            additionalProperties: true
    Task:
      description: Task accepted for asynchronous execution
      headers:
        X-Request-ID:
          schema: {type: string}
          description: Server request identity when supplied by the operation.
      content:
        application/json:
          schema:
            type: object
            required: [task]
            properties:
              task: {$ref: '#/components/schemas/Task'}
    Session:
      description: Authenticated session
      content:
        application/json:
          schema:
            type: object
            required: [user, csrfToken]
            properties:
              user: {$ref: '#/components/schemas/User'}
              csrfToken: {type: string}
    Error:
      description: Structured API error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {$ref: '#/components/schemas/APIError'}
  schemas:
    LoginRequest:
      type: object
      required: [name, password]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        password: {type: string, minLength: 1, maxLength: 128, format: password}
      additionalProperties: false
    ResourceRef:
      type: object
      required: [kind, id]
      properties:
        kind: {type: string}
        id: {type: string}
        nodeId: {type: string}
      additionalProperties: false
    User:
      type: object
      required: [userId, name, admin, disabled, revision]
      properties:
        userId: {type: string}
        name: {type: string}
        admin: {type: boolean}
        disabled: {type: boolean}
        revision: {type: integer, format: int64}
    Audit:
      type: object
      required: [sequence, actorId, resourceKey, action, result, recordedAt]
      properties:
        sequence: {type: integer, format: int64}
        actorId: {type: string}
        nodeId: {type: string}
        resourceKey: {type: string}
        action: {type: string}
        requestId: {type: string}
        result: {type: string}
        recordedAt: {type: string, format: date-time}
    AuditPage:
      type: object
      required: [items, nextOffset]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Audit'}}
        nextOffset: {type: integer, minimum: 0}
    Task:
      type: object
      required: [taskId, requestId, actorId, resource, action, state, phase, revision, createdAt, updatedAt, deadline]
      properties:
        taskId: {type: string}
        requestId: {type: string}
        actorId: {type: string}
        resource: {$ref: '#/components/schemas/ResourceRef'}
        action: {type: string}
        payload: {type: object, additionalProperties: true}
        digest: {type: string}
        state: {type: string, enum: [QUEUED, RUNNING, WAITING_NODE, WAITING_CLIENT, CANCEL_REQUESTED, SUCCEEDED, FAILED, CANCELLED, INTERRUPTED]}
        phase: {type: string}
        revision: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        deadline: {type: string, format: date-time}
        dispatchedAt: {type: string, format: date-time}
        cancellationRequested: {type: boolean}
        cancellationRequestId: {type: string}
        result: {type: object, additionalProperties: true}
        error: {type: string}
    APIError:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
        resource: {$ref: '#/components/schemas/ResourceRef'}
