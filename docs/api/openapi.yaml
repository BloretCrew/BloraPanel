    post:
      tags: [monitoring]
      summary: Terminate one process after identity recheck
      operationId: terminateProcess
      parameters: [{$ref: '#/components/parameters/Id'}, {name: pid, in: path, required: true, schema: {type: integer, format: int64}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startTicks]
              properties:
                startTicks: {type: integer, format: int64, minimum: 1}
