openapi: 3.1.0
info:
  title: Blora Panel management API
  version: 0.1.0
  description: |
    The HTTPS management API for Blora Master. It carries management data only;
    application traffic is never proxied through the Master. All JSON fields use
    lowerCamelCase. Mutating requests require the session CSRF token and an
    Idempotency-Key when the operation can create a task. A 202 response means
    that the task was accepted, not that the remote operation succeeded.
servers:
  - url: /api/v1
    description: Same-origin Master API
tags:
  - name: session
  - name: administration
  - name: nodes
  - name: instances
  - name: tasks
  - name: files
  - name: terminals
  - name: containers
  - name: backups
  - name: schedules
  - name: monitoring
  - name: system
  - name: extensions
  - name: workspaces
security:
  - sessionCookie: []
paths:
  /login:
    post:
      tags: [session]
      security: []
      summary: Create a browser session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /logout:
    post:
      tags: [session]
      summary: Revoke the current browser session
      operationId: logout
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '401': {$ref: '#/components/responses/Error'}
  /session:
    get:
      tags: [session]
      summary: Return the authenticated user and CSRF token
      operationId: session
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
  /enroll:
    post:
      tags: [nodes]
      security: []
      summary: Redeem a one-time node enrollment
      operationId: enroll
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '201': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /users:
    get:
      tags: [administration]
      summary: List users (administrator)
      operationId: listUsers
      responses:
        '200': {$ref: '#/components/responses/Items'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [administration]
      summary: Create a user (administrator)
      operationId: createUser
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '201': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /users/{id}:
    patch:
      tags: [administration]
      summary: Update a user (administrator)
      operationId: updateUser
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /users/{id}/password:
    post:
      tags: [administration]
      summary: Change a user password
      operationId: changePassword
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /roles:
    get:
      tags: [administration]
      summary: List built-in and custom role templates
      operationId: listRoles
      responses:
        '200': {$ref: '#/components/responses/Items'}
        '403': {$ref: '#/components/responses/Error'}
  /roles/{id}:
    put:
      tags: [administration]
      summary: Replace a custom role template
      operationId: putRole
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /roles/{id}/apply:
    post:
      tags: [administration]
      summary: Apply or revoke a role on an explicit resource
      operationId: applyRole
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /grants:
    get:
      tags: [administration]
      summary: List explicit grants visible to the caller
      operationId: listGrants
      responses:
        '200': {$ref: '#/components/responses/Items'}
    post:
      tags: [administration]
      summary: Grant a resource action (administrator)
      operationId: grant
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [administration]
      summary: Revoke a resource action (administrator)
      operationId: revokeGrant
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /audit:
    get:
      tags: [administration]
      summary: Search management audit records (administrator)
      operationId: searchAudit
      parameters:
        - name: userId
          in: query
          schema: {type: string, maxLength: 160}
        - name: nodeId
          in: query
          schema: {type: string, maxLength: 160}
        - name: resource
          in: query
          description: Exact resource key such as node:<id> or instance:<id>.
          schema: {type: string, maxLength: 160}
        - name: action
          in: query
          schema: {type: string, maxLength: 160}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
      responses:
        '200':
          description: Newest matching audit records
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /nodes:
    get:
      tags: [nodes]
      summary: List nodes visible to the caller
      operationId: listNodes
      parameters: [{$ref: '#/components/parameters/NodeScope'}]
      responses:
        '200': {$ref: '#/components/responses/Items'}
  /nodes/creatable:
    get:
      tags: [nodes]
      summary: List nodes where the caller may create instances
      operationId: listCreatableNodes
      responses:
        '200': {$ref: '#/components/responses/Items'}
  /nodes/managed:
    get:
      tags: [nodes]
      summary: List nodes with host management permission
      operationId: listManagedNodes
      responses:
        '200': {$ref: '#/components/responses/Items'}
  /nodes/enrollments:
    post:
      tags: [nodes]
      summary: Create a one-time node enrollment (administrator)
      operationId: createEnrollment
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '201': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
  /nodes/{id}:
    patch:
      tags: [nodes]
      summary: Update node maintenance, quota or display settings
      operationId: updateNode
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /nodes/{id}/revoke:
    post:
      tags: [nodes]
      summary: Revoke a node identity
      operationId: revokeNode
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /nodes/{id}/rotation:
    post:
      tags: [nodes]
      summary: Issue a node identity rotation
      operationId: rotateNode
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
  /instances:
    get:
      tags: [instances]
      summary: List instances authorized for the caller across nodes
      operationId: listInstances
      responses:
        '200': {$ref: '#/components/responses/Items'}
    post:
      tags: [instances]
      summary: Create an instance after rechecking node and quota authorization
      operationId: createInstance
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '201': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /instances/{id}:
    get:
      tags: [instances]
      summary: Get one instance and its authoritative state
      operationId: getInstance
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [instances]
      summary: Update instance settings with a revision precondition
      operationId: updateInstance
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [instances]
      summary: Tombstone a stopped instance (administrator)
      operationId: deleteInstance
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /instances/{id}/actions:
    post:
      tags: [instances]
      summary: Start, stop or restart an instance as a durable task
      operationId: instanceAction
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '202': {$ref: '#/components/responses/Task'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /instance-templates:
    get:
      tags: [instances]
      summary: List safe instance configuration templates
      operationId: listInstanceTemplates
      responses:
        '200': {$ref: '#/components/responses/Items'}
  /tasks:
    get:
      tags: [tasks]
      summary: List tasks visible to the caller
      operationId: listTasks
      description: Use before=0 for current history, then nextBefore for older pages; -1 means end. A page scans at most limit root tasks and filters current authorization, so an empty page can still have a continuation. Stable row cursors avoid shifting when new tasks arrive. Legacy offset mode remains limited to the most recent 1000 root tasks; before cannot be combined with offset.
      parameters:
        - {name: before, in: query, schema: {type: integer, minimum: 0, maximum: 9007199254740991}}
        - {name: state, in: query, description: Filter across all history in before cursor mode, schema: {type: string, enum: [QUEUED, RUNNING, WAITING_NODE, WAITING_CLIENT, CANCEL_REQUESTED, SUCCEEDED, FAILED, CANCELLED, INTERRUPTED]}}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {$ref: '#/components/responses/Items'}
  /tasks/summary:
    get:
      tags: [tasks]
      operationId: taskSummary
      summary: Count all currently authorized nonterminal root tasks
      description: Scans active task pages without the legacy recent-history limit, rechecks authorization, and returns active total and per-state counts. Timeout returns an error instead of partial totals.
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '503': {$ref: '#/components/responses/Error'}
  /tasks/{id}:
    get:
      tags: [tasks]
      summary: Get a task and its durable result
      operationId: getTask
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '404': {$ref: '#/components/responses/Error'}
  /tasks/{id}/cancel:
    post:
      tags: [tasks]
      summary: Request cancellation of a task
      operationId: cancelTask
      description: Requests cancellation of a nonterminal task and returns the durable cancellation receipt. Repeating the request after acceptance, including after CANCELLED, returns the same receipt without advancing the task again.
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/Task'}
        '409': {$ref: '#/components/responses/Error'}
  /tasks/{id}/events:
    get:
      tags: [tasks]
      operationId: taskStageHistory
      summary: Read authorized persistent task stage diagnostics
      description: Latest-first revision cursor. before=0 starts at the latest stage; nextBefore=-1 means end. Each entry contains revision, recordedAt (Unix milliseconds), state, phase, error and truncated. Phase/error are bounded to 512/4096 characters; payload and result blobs are excluded. Current task authorization is checked on every request.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {name: before, in: query, schema: {type: integer, minimum: 0, maximum: 9007199254740991, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /tasks/{id}/retry:
    post:
      tags: [tasks]
      summary: Create a related retry for a failed instance lifecycle task
      operationId: retryTask
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '202': {$ref: '#/components/responses/Task'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /events:
    get:
      tags: [tasks]
      summary: Stream authorized task and resource events over WebSocket
      operationId: events
      description: notifications=1 emits only authorized root task terminal summaries and Snapshot sequence checkpoints. Omit after on the first connection to start at the current durable boundary; reconnect with the last atomically persisted sequence. The ordinary event stream remains unchanged. Payload and execution configuration are omitted from notification summaries.
      parameters:
        - {name: notifications, in: query, schema: {type: integer, enum: [1]}}
        - {name: after, in: query, schema: {type: integer, minimum: 0, maximum: 9007199254740991}}
      x-websocket: true
      responses:
        '101': {description: WebSocket protocol switch}
        '401': {$ref: '#/components/responses/Error'}
  /instances/{id}/files:
    get:
      tags: [files]
      summary: List a bounded page of an instance root
      operationId: listFiles
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Path'}, {$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/Items'}
        '403': {$ref: '#/components/responses/Error'}
  /instances/{id}/files/access:
    get:
      tags: [files]
      summary: Return the current user's file read/write capability and node identity
      operationId: fileAccess
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
  /instances/{id}/files/stat:
    get:
      tags: [files]
      summary: Stat an authorized path
      operationId: statFile
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Path'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '404': {$ref: '#/components/responses/Error'}
  /instances/{id}/files/trash:
    get:
      tags: [files]
      summary: List recoverable entries in the instance trash
      operationId: listTrash
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/Items'}
  /instances/{id}/files/preview:
    get:
      tags: [files]
      summary: Read one bounded UTF-8 preview segment without loading the whole file
      operationId: previewFile
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Path'}
        - {name: version, in: query, schema: {type: string}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 9007199254740991, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 61440, default: 49152}}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
  /instances/{id}/files/content:
    get:
      tags: [files]
      summary: Read UTF-8 text content and its immutable version
      operationId: readFile
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Path'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '413': {$ref: '#/components/responses/Error'}
    put:
      tags: [files]
      summary: Save text content through an idempotent task and version check
      operationId: saveFile
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '202': {$ref: '#/components/responses/Task'}
        '409': {$ref: '#/components/responses/Error'}
  /instances/{id}/files/download:
    get:
      tags: [files]
      summary: Download an authorized file
      operationId: downloadFile
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Path'}, {$ref: '#/components/parameters/Version'}]
      responses:
        '200': {description: File bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/Error'}
  /instances/{id}/files/actions:
    post:
      tags: [files]
      summary: Submit a bounded file operation
      operationId: fileAction
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '202': {$ref: '#/components/responses/Task'}
        '403': {$ref: '#/components/responses/Error'}
  /instances/{id}/files/uploads:
    post:
      tags: [files]
      summary: Begin a resumable browser upload
      operationId: beginUpload
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '202': {$ref: '#/components/responses/Task'}
        '400': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /instances/{id}/files/uploads/{taskId}:
    get:
      tags: [files]
      summary: Read upload checkpoint and task state
      operationId: uploadStatus
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/TaskId'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
    delete:
      tags: [files]
      summary: Request cancellation of an upload
      operationId: cancelUpload
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/Task'}
  /instances/{id}/files/uploads/{taskId}/chunks:
    put:
      tags: [files]
      summary: Commit one upload chunk at an exact offset
      operationId: uploadChunk
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /instances/{id}/files/uploads/{taskId}/complete:
    post:
      tags: [files]
      summary: Complete and verify an upload
      operationId: completeUpload
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/Task'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /nodes/files:
    get:
      tags: [nodes]
      summary: List daemon nodes accessible with file.read for the node file manager
      operationId: listFileManagerNodes
      responses:
        '200': {$ref: '#/components/responses/Items'}
        '403': {$ref: '#/components/responses/Error'}
  /nodes/{id}/files:
    get:
      tags: [files]
      summary: List a bounded page of a daemon node filesystem root
      operationId: listNodeFiles
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Path'}, {$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/Items'}
        '403': {$ref: '#/components/responses/Error'}
  /nodes/{id}/files/access:
    get:
      tags: [files]
      summary: Return the current user's file read/write capability and node identity
      operationId: nodeFileAccess
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '403': {$ref: '#/components/responses/Error'}
  /nodes/{id}/files/stat:
    get:
      tags: [files]
      summary: Stat an authorized path
      operationId: statFileOnNode
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Path'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '404': {$ref: '#/components/responses/Error'}
  /nodes/{id}/files/trash:
    get:
      tags: [files]
      summary: List recoverable entries in the daemon node trash
      operationId: listTrashOnNode
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Offset'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/Items'}
  /nodes/{id}/files/preview:
    get:
      tags: [files]
      summary: Read one bounded UTF-8 preview segment without loading the whole file
      operationId: previewFileOnNode
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Path'}
        - {name: version, in: query, schema: {type: string}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 9007199254740991, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 61440, default: 49152}}
      responses:
