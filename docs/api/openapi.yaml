        '202': {$ref: '#/components/responses/Task'}
        '403': {$ref: '#/components/responses/Error'}
  /nodes/{id}/docker/query:
    post:
      tags: [containers]
      summary: Query Docker objects, projects or capabilities
      operationId: dockerQuery
