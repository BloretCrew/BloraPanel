        '200': {$ref: '#/components/responses/Json'}
  /nodes/{id}/docker/project-saves/{saveId}/chunks:
    put:
      tags: [containers]
      summary: Commit one Compose source chunk
      operationId: composeSaveChunk
      parameters: [{$ref: '#/components/parameters/Id'}, {name: saveId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/Json'}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '409': {$ref: '#/components/responses/Error'}
  /nodes/{id}/docker/project-saves/{saveId}/commit:
    post:
      tags: [containers]
      summary: Commit a complete Compose source
      operationId: commitComposeSave
      parameters: [{$ref: '#/components/parameters/Id'}, {name: saveId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/Task'}
  /nodes/{id}/docker/projects/{projectId}/content:
    get:
      tags: [containers]
      summary: Read the confirmed Compose source
      operationId: composeContent
      parameters: [{$ref: '#/components/parameters/Id'}, {name: projectId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/Version'}]
      responses:
        '200': {$ref: '#/components/responses/Json'}
  /nodes/{id}/system/capabilities:
    get:
      tags: [system]
