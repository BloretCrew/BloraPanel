    get:
      tags: [monitoring]
      summary: Search live host processes with a PID cursor
      operationId: listProcesses
      description: Each response contains at most 100 items sorted by PID and an optional nextAfterPid. Pass this cursor as afterPid; refresh from zero to see newly created lower PIDs. Search matches command or PID across the live process list.
      parameters: [{$ref: '#/components/parameters/Id'}, {name: search, in: query, schema: {type: string, maxLength: 256}}, {name: afterPid, in: query, schema: {type: integer, minimum: 0}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}]
