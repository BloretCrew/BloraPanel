        '200': {$ref: '#/components/responses/Items'}
  /instances/{id}/metrics:
    get:
      tags: [monitoring]
      summary: Read current or stale instance metrics
      operationId: instanceMetrics
      description: Requires current instance.read, rechecked after sampling. Returns stale cached data only for the current runId, preserving its observation time. A changed run during sampling or a mismatched node result returns RUN_CHANGED (409). Missing current-run history does not fall back to a previous run.
