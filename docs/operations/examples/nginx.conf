# Include inside nginx's http {} context (e.g. /etc/nginx/conf.d/blora.conf).
# Master stays on loopback; enable --trusted-proxies 127.0.0.1/32 on Master.
# Replace frontend TLS paths and copy Master's generated tls.crt to backend-ca.pem.
map $http_upgrade $blora_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/blora/tls/fullchain.pem;
    ssl_certificate_key /etc/blora/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Master's built frontend; alternatively extract matching standalone Web
    # into /opt/blora/web and point root there.
    root /opt/blora/master/web/dist;
    index index.html;
    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data: blob:; connect-src 'self' wss:; frame-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Cache-Control no-store always;

    # All browser API, enrollment and node/browser WSS routes live under /api/.
    location /api/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $blora_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        # The public certificate generated in Master's state directory (not its key).
        proxy_ssl_trusted_certificate /etc/blora/backend-ca.pem;
    }

    location = /healthz {
        proxy_pass https://127.0.0.1:8443;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/blora/backend-ca.pem;
    }

    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
